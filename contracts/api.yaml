  # --------------------------------------------------------------------------
  # Onboarding Blocks
  # --------------------------------------------------------------------------

  /cases/{caseId}/onboarding-block:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    get:
      summary: Get onboarding block status
      description: |
        Retrieve onboarding block status for a case.

        **Roles**: All authenticated users

        **Source Requirements**: US-6, EC-009
      operationId: getOnboardingBlock
      tags:
        - Onboarding
      responses:
        '200':
          description: Onboarding block status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingBlockResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /cases/{caseId}/onboarding-block/clear:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    post:
      summary: Clear onboarding block
      description: |
        Clear an onboarding block after analyst disposition.

        **Side Effects**:
        - Calls Spriggy onboarding service API (FR-028)
        - Updates syncStatus (PENDING_SYNC -> SYNCED or SYNC_FAILED)

        **Resilience**: Circuit breaker with retry on API failure (D3, EC-009).

        **Roles**: L1_ANALYST, L2_ANALYST, AML_MANAGER (L1 cannot clear sanctions - FR-016)

        **Source Requirements**: FR-028, FR-016, US-6, US-7
      operationId: clearOnboardingBlock
      tags:
        - Onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearOnboardingBlockRequest'
      responses:
        '200':
          description: Block cleared (or pending sync)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingBlockResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: L1 cannot clear sanctions blocks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: L1_CANNOT_CLEAR_SANCTIONS
                message: L1 analysts cannot clear sanctions blocks
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Block already cleared or no block exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Spriggy API unavailable (block queued for retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: EXTERNAL_SERVICE_UNAVAILABLE
                message: Spriggy onboarding service temporarily unavailable. Block clearance queued for retry.
                details:
                  syncStatus: PENDING_SYNC
                  retryScheduled: true

