# AML Case Management System API
#
# OpenAPI 3.0 specification for the AML Case Management System.
# Feature ID: 001-aml-case-management
# Generated: 2026-01-18

openapi: 3.0.3

info:
  title: "AML Case Management API"
  version: "1.0.0"
  description: |
    API contracts for the AML Case Management System.

    ## Overview

    This API enables Spriggy to meet AUSTRAC AML/CTF compliance obligations by providing
    endpoints for managing KYC remediation, PEP/Sanctions screening disposition, and
    suspicious activity investigation workflows.

    ## Authentication

    All endpoints require Bearer token authentication via OIDC SSO integration (D5).
    Include the token in the Authorization header:

    ```
    Authorization: Bearer <access_token>
    ```

    Webhook endpoints use HMAC signature validation instead of Bearer tokens (D11).

    ## Roles

    The system enforces four distinct roles (FR-063):
    - **L1_ANALYST**: Triage and basic case handling
    - **L2_ANALYST**: Full investigation and SMR recommendation authority
    - **AML_MANAGER**: Approval authority for SMRs
    - **READ_ONLY**: View and export only

    ## Error Handling

    All errors follow a consistent format with machine-readable codes.
    See the ErrorResponse schema for details.

    ## Optimistic Locking

    Case mutations require a `version` field for optimistic locking (D8).
    Version mismatch returns 409 Conflict.

    ## Constitution Alignment

    - **Principle I**: All mutating endpoints create audit log entries
    - **Principle II**: Endpoints enforce role-based access
    - **Principle VI**: No PII in response bodies except authorized fields
    - **Principle VII**: 30s timeout on external calls; error responses include retry guidance
  contact:
    name: AML Compliance Team
    email: aml-tech@spriggy.com.au

servers:
  - url: /api/v1
    description: Production API

tags:
  - name: Webhooks
    description: External system webhook receivers (GreenID, Indue)
  - name: Cases
    description: Case lifecycle management
  - name: Queue
    description: Case queue operations
  - name: SMR
    description: Suspicious Matter Report workflow
  - name: Onboarding
    description: Onboarding block management
  - name: EDD
    description: Enhanced Due Diligence checklist
  - name: Communications
    description: Customer communication records
  - name: Investigation
    description: Investigation findings documentation
  - name: Dashboard
    description: Analyst dashboard and metrics
  - name: Reports
    description: Operational and governance reports
  - name: Notifications
    description: User notification management
  - name: Users
    description: User management
  - name: Configuration
    description: System configuration

# ============================================================================
# PATHS
# ============================================================================

paths:
  # --------------------------------------------------------------------------
  # Webhook Endpoints (HMAC authenticated per D11)
  # --------------------------------------------------------------------------

  /webhooks/greenid:
    post:
      summary: Receive GreenID screening alert
      description: |
        Webhook endpoint for GreenID PEP/Sanctions screening alerts.

        **Authentication**: HMAC signature in X-Signature-256 header (D11)

        **Duplicate Handling**: Webhooks within 24-hour window for same
        customer/alert-type are linked to existing case (EC-005, D3).

        **Source Requirements**: FR-001, FR-002, FR-029, FR-030, FR-031, US-6, US-7
      operationId: receiveGreenIdWebhook
      tags:
        - Webhooks
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GreenIdWebhookPayload'
      responses:
        '202':
          description: Webhook accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid HMAC signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: WEBHOOK_AUTH_FAILED
                message: Invalid or missing webhook signature
        '409':
          description: Duplicate webhook (already processed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDuplicateResponse'

  /webhooks/indue:
    post:
      summary: Receive Indue transaction monitoring alert
      description: |
        Webhook endpoint for Indue transaction monitoring alerts.

        **Authentication**: HMAC signature in X-Signature-256 header (D11)

        **Source Requirements**: FR-001, FR-002, US-3
      operationId: receiveIndueWebhook
      tags:
        - Webhooks
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndueWebhookPayload'
      responses:
        '202':
          description: Webhook accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid HMAC signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: WEBHOOK_AUTH_FAILED
                message: Invalid or missing webhook signature
        '409':
          description: Duplicate webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDuplicateResponse'

  # --------------------------------------------------------------------------
  # Case Endpoints
  # --------------------------------------------------------------------------

  /cases:
    get:
      summary: List cases
      description: |
        Retrieve paginated list of cases with filtering.
        Default ordering: SLA urgency (most urgent first), then creation date (oldest first).

        **Roles**: All authenticated users

        **Source Requirements**: FR-024, FR-025, US-12
      operationId: listCases
      tags:
        - Cases
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          description: Filter by case status
          schema:
            $ref: '#/components/schemas/CaseStatus'
        - name: caseType
          in: query
          description: Filter by case type
          schema:
            $ref: '#/components/schemas/CaseType'
        - name: assignedUserId
          in: query
          description: Filter by assigned analyst (use 'me' for current user, 'unassigned' for queue)
          schema:
            type: string
        - name: tier
          in: query
          description: Filter by analyst tier
          schema:
            $ref: '#/components/schemas/Tier'
        - name: slaStatus
          in: query
          description: Filter by SLA status
          schema:
            type: string
            enum: [on_track, warning, breached]
        - name: customerId
          in: query
          description: Filter by customer ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    get:
      summary: Get case details
      description: |
        Retrieve full case details including timeline, communications, and related entities.

        **Audit**: Creates CASE_VIEWED audit entry (FR-059)

        **Roles**: All authenticated users

        **Source Requirements**: FR-059, US-1
      operationId: getCase
      tags:
        - Cases
      responses:
        '200':
          description: Case details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /cases/{caseId}/claim:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    post:
      summary: Claim case from queue
      description: |
        Claim an unassigned case to the current analyst.

        **State Transition**: OPEN -> IN_PROGRESS (explicit claim)

        **Tier Restrictions**: L1 analysts can only claim L1-tier cases. Cases in ESCALATED status or
        with tier=L2 require L2+ role. Attempting to claim a higher-tier case returns 403 TIER_MISMATCH.

        **Optimistic Locking**: Requires version to prevent race conditions (D8, EC-001)

        **Roles**: L1_ANALYST, L2_ANALYST, AML_MANAGER

        **Source Requirements**: D13, EC-001
      operationId: claimCase
      tags:
        - Cases
        - Queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCaseRequest'
      responses:
        '200':
          description: Case claimed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient role, case already assigned, or tier mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyAssigned:
                  summary: Case already assigned
                  value:
                    code: CASE_ALREADY_ASSIGNED
                    message: Case is already assigned to another analyst
                tierMismatch:
                  summary: L1 attempting to claim L2-tier case
                  value:
                    code: TIER_MISMATCH
                    message: L1 analysts cannot claim L2-tier cases. Case has been escalated or requires L2+ authority.
                    details:
                      caseTier: L2
                      userRole: L1_ANALYST
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /cases/{caseId}/close:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    post:
      summary: Close case
      description: |
        Close a case with documented disposition.

        **Implicit Claim**: If case is unassigned (OPEN), closing atomically claims and closes it.

        **L2 Review Flag**: L1 closures with SATISFACTORY_EXPLANATION set l2ReviewStatus to PENDING_REVIEW (FR-012).

        **Tier Restrictions**: L1 analysts can only close L1-tier cases. Cases in ESCALATED status or
        with tier=L2 require L2+ role. Attempting to close a higher-tier case returns 403 TIER_MISMATCH.

        **State Transitions**:
        - OPEN -> CLOSED (with implicit claim)
        - IN_PROGRESS -> CLOSED
        - PENDING_INFORMATION -> CLOSED

        **Roles**: L1_ANALYST, L2_ANALYST, AML_MANAGER

        **Source Requirements**: FR-009, FR-011, FR-012, FR-015, US-1, US-13
      operationId: closeCase
      tags:
        - Cases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseCaseRequest'
      responses:
        '200':
          description: Case closed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '400':
          description: Missing required documentation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: DOCUMENTATION_REQUIRED
                message: Required closure documentation fields are missing
                details:
                  missingFields: [justification]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient role or tier mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Insufficient role
                  value:
                    code: FORBIDDEN
                    message: You do not have permission to perform this action
                tierMismatch:
                  summary: L1 attempting to close L2-tier case
                  value:
                    code: TIER_MISMATCH
                    message: L1 analysts cannot close L2-tier cases. Case has been escalated or requires L2+ authority.
                    details:
                      caseTier: L2
                      userRole: L1_ANALYST
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_STATE_TRANSITION
                message: Cannot close case in current state

  /cases/{caseId}/escalate:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    post:
      summary: Escalate case to L2
      description: |
        Escalate case from L1 to L2 investigation queue with documented reasoning.

        **State Transition**: IN_PROGRESS -> ESCALATED

        **Roles**: L1_ANALYST only (L2+ already has authority)

        **Source Requirements**: FR-013, US-3
      operationId: escalateCase
      tags:
        - Cases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateCaseRequest'
      responses:
        '200':
          description: Case escalated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only L1 analysts can escalate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: L1_ESCALATION_ONLY
                message: Only L1 analysts can escalate cases to L2
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: Case not in escalatable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cases/{caseId}/reopen:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    post:
      summary: Reopen closed case (L2 quality review)
      description: |
        Reopen a closed case as part of L2 quality review, overturning the L1 closure decision.
        Case is assigned to the reopening L2 analyst.

        **State Transition**: CLOSED -> IN_PROGRESS

        **Side Effects**:
        - Sets l2ReviewStatus to REVIEWED_REOPENED
        - Creates assignment to L2 analyst
        - Clears closedAt timestamp

        **Roles**: L2_ANALYST, AML_MANAGER

        **Source Requirements**: FR-018, FR-019, US-16
      operationId: reopenCase
      tags:
        - Cases
        - Queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenCaseRequest'
      responses:
        '200':
          description: Case reopened successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: L2+ role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: Case is not closed or not an L1 closure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cases/{caseId}/request-information:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    post:
      summary: Record customer information request
      description: |
        Record an outbound customer communication requesting information.

        **State Transition**: IN_PROGRESS -> PENDING_INFORMATION

        **Roles**: L1_ANALYST, L2_ANALYST, AML_MANAGER

        **Source Requirements**: FR-010, FR-053, FR-055, US-2
      operationId: requestInformation
      tags:
        - Cases
        - Communications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInformationRequest'
      responses:
        '200':
          description: Communication recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /cases/{caseId}/record-response:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    post:
      summary: Record customer response
      description: |
        Record an inbound customer response and analyst assessment.

        **State Transition**: PENDING_INFORMATION -> IN_PROGRESS

        **Roles**: L1_ANALYST, L2_ANALYST, AML_MANAGER

        **Source Requirements**: FR-056, US-2
      operationId: recordResponse
      tags:
        - Cases
        - Communications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordResponseRequest'
      responses:
        '200':
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /cases/{caseId}/create-supplementary:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    post:
      summary: Create supplementary SMR case
      description: |
        Create a new case linked to a previously filed SMR for supplementary filing.

        **Precondition**: Original case must have status SMR_FILED.

        **Roles**: L2_ANALYST, AML_MANAGER

        **Source Requirements**: FR-044, FR-045, FR-046, US-18
      operationId: createSupplementaryCase
      tags:
        - Cases
        - SMR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplementaryCaseRequest'
      responses:
        '201':
          description: Supplementary case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Original case not in SMR_FILED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --------------------------------------------------------------------------
  # L2 Quality Review Queue
  # --------------------------------------------------------------------------

  /queue/l2-review:
    get:
      summary: List L1 closures pending L2 review
      description: |
        Retrieve cases closed by L1 with satisfactory explanation that are pending L2 quality review.

        **Filter**: Cases where l2ReviewStatus = PENDING_REVIEW

        **Roles**: L2_ANALYST, AML_MANAGER

        **Source Requirements**: FR-012, FR-018, US-16
      operationId: listL2ReviewQueue
      tags:
        - Queue
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: L2 review queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: L2+ role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /queue/l2-review/{caseId}/accept:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    post:
      summary: Accept L1 closure decision
      description: |
        Accept an L1 closure decision as part of quality review. Case remains closed.

        **Side Effect**: Sets l2ReviewStatus to REVIEWED_ACCEPTED

        **Roles**: L2_ANALYST, AML_MANAGER

        **Source Requirements**: FR-018
      operationId: acceptL1Closure
      tags:
        - Queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptL1ClosureRequest'
      responses:
        '200':
          description: L1 closure accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Case not in L2 review queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /queue/unassigned:
    get:
      summary: List unassigned cases
      description: |
        Retrieve unassigned cases available for claiming, ordered by SLA urgency.

        **Roles**: L1_ANALYST, L2_ANALYST, AML_MANAGER

        **Source Requirements**: D13, FR-024, FR-025
      operationId: listUnassignedQueue
      tags:
        - Queue
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: tier
          in: query
          description: Filter by analyst tier
          schema:
            $ref: '#/components/schemas/Tier'
      responses:
        '200':
          description: Unassigned case queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --------------------------------------------------------------------------
  # Investigation Findings
  # --------------------------------------------------------------------------

  /cases/{caseId}/investigation-findings:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    get:
      summary: Get investigation findings
      description: |
        Retrieve investigation findings for a case.

        **Roles**: All authenticated users

        **Source Requirements**: US-4
      operationId: getInvestigationFindings
      tags:
        - Investigation
      responses:
        '200':
          description: Investigation findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationFindingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Case or findings not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create investigation findings
      description: |
        Document investigation findings for a case.

        **Precondition**: Findings do not already exist for this case.

        **Roles**: L2_ANALYST, AML_MANAGER

        **Source Requirements**: US-4, BR-INV-001
      operationId: createInvestigationFindings
      tags:
        - Investigation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvestigationFindingsRequest'
      responses:
        '201':
          description: Investigation findings created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationFindingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: L2+ role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Investigation findings already exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update investigation findings
      description: |
        Update existing investigation findings.

        **Roles**: L2_ANALYST, AML_MANAGER

        **Source Requirements**: US-4
      operationId: updateInvestigationFindings
      tags:
        - Investigation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvestigationFindingsRequest'
      responses:
        '200':
          description: Investigation findings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationFindingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------------------
  # SMR Workflow
  # --------------------------------------------------------------------------

  /cases/{caseId}/smr-recommendation:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    get:
      summary: Get SMR recommendation
      description: |
        Retrieve SMR recommendation for a case.

        **Roles**: All authenticated users

        **Source Requirements**: US-4, US-5
      operationId: getSMRRecommendation
      tags:
        - SMR
      responses:
        '200':
          description: SMR recommendation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMRRecommendationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Create SMR recommendation
      description: |
        Create an SMR recommendation for a case.

        **Precondition**: Investigation findings must exist (BR-INV-002).

        **State Transition**: IN_PROGRESS -> PENDING_APPROVAL

        **Segregation**: Original recommender cannot approve (FR-020).

        **Roles**: L2_ANALYST, AML_MANAGER

        **Source Requirements**: FR-014, FR-039, US-4, BR-SMR-001
      operationId: createSMRRecommendation
      tags:
        - SMR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSMRRecommendationRequest'
      responses:
        '201':
          description: SMR recommendation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMRRecommendationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: L2+ role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: L2_ROLE_REQUIRED
                message: Only L2 analysts or higher can create SMR recommendations
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: SMR recommendation already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Investigation findings required first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVESTIGATION_FINDINGS_REQUIRED
                message: Investigation findings must be documented before creating SMR recommendation

  /cases/{caseId}/smr-recommendation/approve:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    post:
      summary: Approve SMR recommendation
      description: |
        Approve an SMR recommendation as AML Compliance Manager.

        **Segregation**: Cannot approve your own recommendation (FR-020, EC-003).

        **State Transition**: PENDING_APPROVAL -> CLOSED

        **Side Effects**:
        - Generates SMR draft document (FR-040)
        - Creates notification to recommender

        **Roles**: AML_MANAGER only

        **Source Requirements**: FR-020, FR-021, FR-040, US-5, BR-SMR-002, BR-SMR-003
      operationId: approveSMRRecommendation
      tags:
        - SMR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveSMRRequest'
      responses:
        '200':
          description: SMR approved, draft generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMRApprovalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot approve own recommendation or not AML Manager
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                segregationViolation:
                  summary: Approving own recommendation
                  value:
                    code: SEGREGATION_VIOLATION
                    message: Cannot approve your own SMR recommendation
                roleRequired:
                  summary: Not AML Manager
                  value:
                    code: AML_MANAGER_REQUIRED
                    message: Only AML Compliance Manager can approve SMR recommendations
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: SMR not in PENDING status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cases/{caseId}/smr-recommendation/reject:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    post:
      summary: Reject SMR recommendation
      description: |
        Reject an SMR recommendation with feedback for revision.

        **State Transition**: PENDING_APPROVAL -> IN_PROGRESS

        **Side Effects**:
        - Increments rejectionCount
        - Adds entry to rejectionHistory
        - Creates notification to recommender

        **No Limit**: No system-imposed limit on rejections (EC-010).

        **Roles**: AML_MANAGER only

        **Source Requirements**: FR-021, FR-023, US-5, EC-010
      operationId: rejectSMRRecommendation
      tags:
        - SMR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectSMRRequest'
      responses:
        '200':
          description: SMR rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMRRecommendationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: SMR not in PENDING status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cases/{caseId}/smr-recommendation/resubmit:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    post:
      summary: Resubmit SMR recommendation after rejection
      description: |
        Resubmit a rejected SMR recommendation with revised narrative.

        **State Transition**: SMR status REJECTED -> PENDING

        **Roles**: L2_ANALYST, AML_MANAGER

        **Source Requirements**: FR-023, EC-010
      operationId: resubmitSMRRecommendation
      tags:
        - SMR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResubmitSMRRequest'
      responses:
        '200':
          description: SMR resubmitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMRRecommendationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: SMR not in REJECTED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cases/{caseId}/smr-recommendation/record-reference:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    post:
      summary: Record AUSTRAC reference number
      description: |
        Record the AUSTRAC reference number after manual SMR submission.

        **Precondition**: SMR must be APPROVED.

        **State Transition**: Case CLOSED -> SMR_FILED, SMR APPROVED -> FILED

        **No Withdrawal**: Approved SMRs cannot be withdrawn (FR-043).

        **Roles**: L1_ANALYST, L2_ANALYST, AML_MANAGER

        **Source Requirements**: FR-041, FR-042, FR-043, US-11
      operationId: recordAUSTRACReference
      tags:
        - SMR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAUSTRACReferenceRequest'
      responses:
        '200':
          description: AUSTRAC reference recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMRRecommendationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: SMR not in APPROVED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cases/{caseId}/smr-draft:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'

    get:
      summary: Download SMR draft document
      description: |
        Download the generated SMR draft document for manual AUSTRAC submission.

        **Roles**: L1_ANALYST, L2_ANALYST, AML_MANAGER

        **Source Requirements**: FR-040
      operationId: downloadSMRDraft
      tags:
        - SMR
      responses:
        '200':
          description: SMR draft document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: SMR draft not found (SMR may not be approved)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

