      tags:
        - Cases
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - documentType
              properties:
                file:
                  type: string
                  format: binary
                documentType:
                  $ref: '#/components/schemas/DocumentType'
                description:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cases/{caseId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/CaseIdParam'
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Download document
      description: |
        Download a case document.

        **Roles**: All authenticated users
      operationId: downloadDocument
      tags:
        - Cases
      responses:
        '200':
          description: Document file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------------------
  # Users
  # --------------------------------------------------------------------------

  /users/me:
    get:
      summary: Get current user
      description: |
        Retrieve the authenticated user's profile.

        **Roles**: All authenticated users
      operationId: getCurrentUser
      tags:
        - Users
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      summary: List users
      description: |
        Retrieve list of system users.

        **Roles**: AML_MANAGER
      operationId: listUsers
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}/role:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      summary: Update user role
      description: |
        Update a user's system role.

        **Side Effect**: All cases assigned to user are returned to unassigned queue (FR-026, FR-027).

        **Roles**: AML_MANAGER

        **Source Requirements**: FR-026, FR-027, US-14
      operationId: updateUserRole
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------------------
  # Configuration
  # --------------------------------------------------------------------------

  /config/pep-threshold:
    get:
      summary: Get current PEP threshold
      description: |
        Retrieve current PEP confidence score threshold configuration.

        **Roles**: All authenticated users

        **Source Requirements**: FR-030, EC-011
      operationId: getPEPThreshold
      tags:
        - Configuration
      responses:
        '200':
          description: PEP threshold configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PEPThresholdResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      summary: Update PEP threshold
      description: |
        Update PEP confidence score threshold.

        **Roles**: AML_MANAGER

        **Source Requirements**: FR-030
      operationId: updatePEPThreshold
      tags:
        - Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePEPThresholdRequest'
      responses:
        '200':
          description: Threshold updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PEPThresholdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /config/sla-warning-threshold:
    get:
      summary: Get SLA warning threshold
      description: |
        Retrieve current SLA warning threshold configuration.

        Cases approaching this percentage of their SLA deadline trigger warning notifications (FR-050).

        **Roles**: All authenticated users

        **Source Requirements**: FR-050, US-9, D2
      operationId: getSLAWarningThreshold
      tags:
        - Configuration
      responses:
        '200':
          description: SLA warning threshold configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLAWarningThresholdResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      summary: Update SLA warning threshold
      description: |
        Update SLA warning threshold percentage.

        Threshold is expressed as a percentage (0-100). Default is 80, meaning warnings trigger
        when 80% of the SLA timeline has elapsed.

        **Roles**: AML_MANAGER

        **Source Requirements**: FR-050, D2
      operationId: updateSLAWarningThreshold
      tags:
        - Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSLAWarningThresholdRequest'
      responses:
        '200':
          description: Threshold updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLAWarningThresholdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /config/holidays:
    get:
      summary: List holiday overrides
      description: |
        Retrieve custom holiday dates for SLA calculation.

        **Roles**: All authenticated users

        **Source Requirements**: D2, FR-048
      operationId: listHolidayOverrides
      tags:
        - Configuration
      parameters:
        - name: year
          in: query
          description: Filter by year
          schema:
            type: integer
      responses:
        '200':
          description: Holiday overrides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayOverrideListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Add holiday override
      description: |
        Add a custom holiday date for SLA calculation.

        **Roles**: AML_MANAGER
      operationId: addHolidayOverride
      tags:
        - Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddHolidayOverrideRequest'
      responses:
        '201':
          description: Holiday added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayOverrideResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Holiday already exists for this date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# ============================================================================
# COMPONENTS
# ============================================================================

components:
  # --------------------------------------------------------------------------
  # Security Schemes
  # --------------------------------------------------------------------------

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from OIDC SSO

  # --------------------------------------------------------------------------
  # Common Parameters
  # --------------------------------------------------------------------------

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    CaseIdParam:
      name: caseId
      in: path
      required: true
      description: Case unique identifier
      schema:
        type: string
        format: uuid

    WebhookSignature:
      name: X-Signature-256
      in: header
      required: true
      description: HMAC-SHA256 signature of request body
      schema:
        type: string

    WebhookTimestamp:
      name: X-Timestamp
      in: header
      required: true
      description: ISO8601 timestamp of webhook generation
      schema:
        type: string
        format: date-time

  # --------------------------------------------------------------------------
  # Common Responses
  # --------------------------------------------------------------------------

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: One or more fields are invalid

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: Authentication required

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: You do not have permission to access this resource

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: The requested resource was not found

    VersionConflict:
      description: Optimistic locking conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionConflictResponse'
          example:
            code: VERSION_CONFLICT
            message: Case was modified by another user
            details:
              currentVersion: 5
              yourVersion: 3

  # --------------------------------------------------------------------------
  # Schemas
  # --------------------------------------------------------------------------

  schemas:
    # --- Error Schemas ---

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable message
          example: One or more fields are invalid
        details:
          type: object
          additionalProperties: true
          description: Additional error context

    VersionConflictResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            details:
              type: object
              properties:
                currentVersion:
                  type: integer
                  description: Current version in database
                yourVersion:
                  type: integer
                  description: Version you attempted to update

    # --- Enums ---

    CaseType:
      type: string
      enum:
        - KYC_REMEDIATION
        - PEP_SANCTIONS_SCREENING
        - SUSPICIOUS_ACTIVITY
        - SUPPLEMENTARY_SMR

    CaseSubtype:
      type: string
      enum:
        - SANCTIONS_ONBOARDING
        - SANCTIONS_EXISTING_CUSTOMER
        - PEP_EDD_REQUIRED
        - PEP_PROVISIONAL_REVIEW

    CaseStatus:
      type: string
      enum:
        - OPEN
        - IN_PROGRESS
        - PENDING_INFORMATION
        - ESCALATED
        - PENDING_APPROVAL
        - CLOSED
        - SMR_FILED

    L2ReviewStatus:
      type: string
      enum:
        - NOT_REQUIRED
        - PENDING_REVIEW
        - REVIEWED_ACCEPTED
        - REVIEWED_REOPENED

    Tier:
      type: string
      enum:
        - L1
        - L2

    UserRole:
      type: string
      enum:
        - L1_ANALYST
        - L2_ANALYST
        - AML_MANAGER
        - READ_ONLY

    AlertSource:
      type: string
      enum:
        - GREENID
        - INDUE

    ClosureDisposition:
      type: string
      enum:
        - FALSE_POSITIVE
        - SATISFACTORY_EXPLANATION
        - NO_FURTHER_ACTION
        - ACCOUNT_RESTRICTIONS_RECOMMENDED

    SMRStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
        - FILED

    InvestigationConclusion:
      type: string
      enum:
        - NO_SUSPICION
        - SUSPICIOUS_ACTIVITY_IDENTIFIED
        - INSUFFICIENT_EVIDENCE
        - FURTHER_MONITORING_REQUIRED

    BlockType:
      type: string
      enum:
        - SANCTIONS
        - PEP_EDD_REQUIRED

    SyncStatus:
      type: string
      enum:
        - SYNCED
        - PENDING_SYNC
        - SYNC_FAILED

    NotificationType:
      type: string
      enum:
        - CASE_ASSIGNED
        - SLA_WARNING
        - SLA_BREACH
        - ESCALATION
        - SMR_PENDING_APPROVAL
        - SMR_APPROVED
        - SMR_REJECTED

    DocumentType:
      type: string
      enum:
        - SMR_DRAFT
        - EVIDENCE
        - CUSTOMER_DOCUMENT
        - OTHER

    CommunicationDirection:
      type: string
      enum:
        - OUTBOUND
        - INBOUND

    CommunicationChannel:
      type: string
      enum:
        - EMAIL
        - IN_APP
        - PHONE
        - OTHER

    EnhancedMonitoringFrequency:
      type: string
      enum:
        - WEEKLY
        - MONTHLY
        - QUARTERLY
        - ANNUALLY

    # --- Webhook Schemas ---

    GreenIdWebhookPayload:
      type: object
      required:
        - alertId
        - customerId
        - alertType
        - matchData
        - timestamp
      properties:
        alertId:
          type: string
          description: GreenID alert identifier
        customerId:
          type: string
          description: Spriggy customer identifier
        alertType:
          type: string
          enum: [SANCTIONS, PEP]
          description: Type of screening alert
        confidenceScore:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Match confidence score (PEP alerts only)
        matchData:
          type: object
          description: Screening match details
          properties:
            matchedName:
              type: string
            matchedList:
              type: string
            matchReasons:
              type: array
              items:
                type: string
        customerOnboardingStatus:
          type: string
          enum: [IN_PROGRESS, COMPLETED]
          description: Customer's onboarding status at alert time
        timestamp:
          type: string
          format: date-time
          description: Alert generation time

    IndueWebhookPayload:
      type: object
      required:
        - alertId
        - customerId
        - alertType
        - alertDetails
        - timestamp
      properties:
        alertId:
          type: string
          description: Indue alert identifier
        customerId:
          type: string
          description: Spriggy customer identifier
        alertType:
          type: string
          enum: [SUSPICIOUS_TRANSACTION, UNUSUAL_PATTERN, THRESHOLD_BREACH]
        alertDetails:
          type: object
          description: Transaction monitoring alert details
          properties:
            ruleTriggered:
              type: string
            transactionIds:
              type: array
              items:
                type: string
            totalAmount:
              type: number
            currency:
              type: string
        customerOnboardingStatus:
          type: string
          enum: [IN_PROGRESS, COMPLETED]
          description: |
            Customer's onboarding status when alert was triggered.
            - IN_PROGRESS: Customer is still being onboarded (onboarding alerts per FR-036)
            - COMPLETED: Customer onboarding is complete (existing customer alerts per FR-037)
            Used to distinguish between onboarding alerts (which may trigger blocks) and
            existing customer alerts (which require analyst discretion on restrictions).
        timestamp:
          type: string
          format: date-time

    WebhookAcceptedResponse:
      type: object
      required:
        - received
        - caseId
        - caseReference
      properties:
        received:
          type: boolean
          example: true
        caseId:
          type: string
          format: uuid
          description: Created case ID
        caseReference:
          type: string
          description: Human-readable case reference
          example: AML-1001

    WebhookDuplicateResponse:
      type: object
      required:
        - duplicate
        - existingCaseId
        - existingCaseReference
      properties:
        duplicate:
          type: boolean
          example: true
        existingCaseId:
          type: string
          format: uuid
        existingCaseReference:
          type: string
          example: AML-1001
        message:
          type: string
          example: Duplicate webhook linked to existing case

    # --- Case Schemas ---

    CaseSummary:
      type: object
      required:
        - id
        - referenceCode
        - caseType
        - status
        - tier
        - slaDeadline
        - slaStatus
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        referenceCode:
          type: string
          example: AML-1001
        caseType:
          $ref: '#/components/schemas/CaseType'
        caseSubtype:
          $ref: '#/components/schemas/CaseSubtype'
        status:
          $ref: '#/components/schemas/CaseStatus'
        tier:
          $ref: '#/components/schemas/Tier'
        slaDeadline:
          type: string
          format: date-time
        slaStatus:
          type: string
          enum: [on_track, warning, breached]
        slaBreached:
          type: boolean
        l2ReviewStatus:
          $ref: '#/components/schemas/L2ReviewStatus'
        assignedUser:
          $ref: '#/components/schemas/UserSummary'
        customer:
          $ref: '#/components/schemas/CustomerSummary'
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time

    CaseDetailResponse:
      allOf:
        - $ref: '#/components/schemas/CaseSummary'
        - type: object
          required:
            - version
          properties:
            referenceNumber:
              type: integer
            source:
              $ref: '#/components/schemas/AlertSource'
            sourceAlertId:
              type: string
            pepConfidenceScore:
              type: number
              format: float
            hasCombinedAlert:
              type: boolean
            version:
              type: integer
              description: Optimistic lock version
            updatedAt:
              type: string
              format: date-time
            linkedCases:
              type: array
              items:
                $ref: '#/components/schemas/LinkedCaseSummary'
            hasOnboardingBlock:
              type: boolean
            hasEDDChecklist:
              type: boolean
            hasSMRRecommendation:
              type: boolean
            hasInvestigationFindings:
              type: boolean

    CaseListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummary'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    LinkedCaseSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceCode:
          type: string
        linkType:
          type: string
          enum: [SUPPLEMENTARY_TO_ORIGINAL, RELATED, SAME_CUSTOMER]
        direction:
          type: string
          enum: [source, target]

    ClaimCaseRequest:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          description: Current case version for optimistic locking

    CloseCaseRequest:
      type: object
      required:
        - version
        - disposition
        - justification
      properties:
        version:
          type: integer
        disposition:
          $ref: '#/components/schemas/ClosureDisposition'
        justification:
          type: string
          minLength: 50
          description: Required closure justification

    EscalateCaseRequest:
      type: object
      required:
        - version
        - escalationReason
      properties:
        version:
          type: integer
        escalationReason:
          type: string
          minLength: 50
          description: Documented reasoning for escalation

    ReopenCaseRequest:
      type: object
      required:
        - version
        - reopenReason
      properties:
        version:
          type: integer
        reopenReason:
          type: string
          minLength: 50
          description: Reason for overturning L1 closure

    CreateSupplementaryCaseRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 50
          description: Reason for supplementary filing

    # --- Customer Schemas ---

    CustomerSummary:
      type: object
      description: |
        Customer snapshot captured at case creation time.

        **Immutability**: Customer data is captured as a snapshot when the case is created.
        Subsequent changes to the customer's profile in Spriggy do not update this snapshot.
        This ensures case context reflects the state at the time of the alert, which is
        important for audit and investigation purposes. If updated customer information
        is needed, analysts can reference Spriggy's customer management system directly.
      required:
        - id
        - externalId
      properties:
        id:
          type: string
          format: uuid
        externalId:
          type: string
          description: Spriggy customer identifier
        displayName:
          type: string
          description: Masked or authorized display name
        accountStatus:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
          description: Customer account status at time of case creation (snapshot)
        onboardingStatus:
          type: string
          enum: [IN_PROGRESS, COMPLETED, BLOCKED, UNKNOWN]
          description: Customer onboarding status at time of case creation (snapshot)
        snapshotAt:
          type: string
          format: date-time
          description: Timestamp when this customer data snapshot was captured

    # --- User Schemas ---

    UserSummary:
      type: object
      required:
        - id
        - displayName
        - role
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    UserResponse:
      type: object
      required:
        - id
        - email
        - role
        - isActive
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
        roleChangedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    UpdateUserRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/UserRole'

    # --- Communication Schemas ---

    RequestInformationRequest:
      type: object
      required:
        - version
        - templateId
        - channel
        - content
      properties:
        version:
          type: integer
        templateId:
          type: string
          description: Communication template ID
        channel:
          $ref: '#/components/schemas/CommunicationChannel'
        content:
          type: string
          description: Rendered communication content

    RecordResponseRequest:
      type: object
      required:
        - version
        - customerResponse
        - responseAssessment
      properties:
        version:
          type: integer
        customerResponse:
          type: string
          description: Customer's response content
        responseAssessment:
          type: string
          minLength: 20
          description: Analyst assessment of the response
        respondedAt:
          type: string
          format: date-time
          description: When customer responded

    CommunicationTemplateResponse:
      type: object
      required:
        - id
        - name
        - version
        - content
        - applicableCaseTypes
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        content:
          type: string
        placeholders:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              required:
                type: boolean
        applicableCaseTypes:
          type: array
          items:
            $ref: '#/components/schemas/CaseType'

    CommunicationTemplateListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommunicationTemplateResponse'

    # --- Investigation Findings Schemas ---

    InvestigationFindingsResponse:
      type: object
      required:
        - id
        - caseId
        - conclusion
        - completedAt
        - completedBy
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        entitiesInvolved:
          type: array
          items:
            $ref: '#/components/schemas/InvolvedEntity'
        transactionPatterns:
          type: array
          items:
            $ref: '#/components/schemas/TransactionPattern'
        suspiciousIndicators:
          type: array
          items:
            $ref: '#/components/schemas/SuspiciousIndicator'
        conclusion:
          $ref: '#/components/schemas/InvestigationConclusion'
        notes:
          type: string
        completedAt:
          type: string
          format: date-time
        completedBy:
          $ref: '#/components/schemas/UserSummary'

    InvolvedEntity:
      type: object
      required:
        - entityType
        - name
      properties:
        entityType:
          type: string
          enum: [PERSON, BUSINESS, ACCOUNT, OTHER]
        identifier:
          type: string
        name:
          type: string
        role:
          type: string
        notes:
          type: string

    TransactionPattern:
      type: object
      required:
        - patternType
        - description
      properties:
        patternType:
          type: string
        description:
          type: string
        dateRange:
          type: object
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        totalAmount:
          type: number
        transactionCount:
          type: integer

    SuspiciousIndicator:
      type: object
      required:
        - indicatorCode
        - description
        - severity
      properties:
        indicatorCode:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        evidence:
          type: string

    CreateInvestigationFindingsRequest:
      type: object
      required:
        - conclusion
      properties:
        entitiesInvolved:
          type: array
          items:
            $ref: '#/components/schemas/InvolvedEntity'
        transactionPatterns:
          type: array
          items:
            $ref: '#/components/schemas/TransactionPattern'
        suspiciousIndicators:
          type: array
          items:
            $ref: '#/components/schemas/SuspiciousIndicator'
        conclusion:
          $ref: '#/components/schemas/InvestigationConclusion'
        notes:
          type: string

    UpdateInvestigationFindingsRequest:
      type: object
      properties:
        entitiesInvolved:
          type: array
          items:
            $ref: '#/components/schemas/InvolvedEntity'
        transactionPatterns:
          type: array
          items:
            $ref: '#/components/schemas/TransactionPattern'
        suspiciousIndicators:
          type: array
          items:
            $ref: '#/components/schemas/SuspiciousIndicator'
        conclusion:
          $ref: '#/components/schemas/InvestigationConclusion'
        notes:
          type: string

    # --- SMR Schemas ---

    SMRRecommendationResponse:
      type: object
      required:
        - id
        - caseId
        - status
        - narrative
        - reasonForSuspicion
        - recommendingUser
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SMRStatus'
        narrative:
          type: string
        reasonForSuspicion:
          type: string
        evidenceReferences:
          type: array
          items:
            type: string
        recommendingUser:
          $ref: '#/components/schemas/UserSummary'
        rejectionCount:
          type: integer
        rejectionHistory:
          type: array
          items:
            $ref: '#/components/schemas/SMRRejection'
        approvingUser:
          $ref: '#/components/schemas/UserSummary'
        approvedAt:
          type: string
          format: date-time
        austracReferenceNumber:
          type: string
        austracFiledAt:
          type: string
          format: date-time
        isSupplementary:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SMRRejection:
      type: object
      properties:
        rejectedAt:
          type: string
          format: date-time
        rejectedBy:
          $ref: '#/components/schemas/UserSummary'
        reason:
          type: string

    CreateSMRRecommendationRequest:
      type: object
      required:
        - narrative
        - reasonForSuspicion
      properties:
        narrative:
          type: string
          minLength: 100
          description: Detailed narrative description
        reasonForSuspicion:
          type: string
          minLength: 50
          description: Why activity is suspicious
        evidenceReferences:
          type: array
          items:
            type: string
          description: References to evidence documents

    ApproveSMRRequest:
      type: object
      properties:
        approvalNotes:
          type: string
          description: Optional approval notes

    SMRApprovalResponse:
      allOf:
        - $ref: '#/components/schemas/SMRRecommendationResponse'
        - type: object
          properties:
            smrDraftGenerated:
              type: boolean
            smrDraftId:
              type: string
              format: uuid

    RejectSMRRequest:
      type: object
      required:
        - rejectionReason
      properties:
        rejectionReason:
          type: string
          minLength: 50
          description: Reason for rejection with feedback

    ResubmitSMRRequest:
      type: object
      required:
        - narrative
        - reasonForSuspicion
      properties:
        narrative:
          type: string
          minLength: 100
        reasonForSuspicion:
          type: string
          minLength: 50
        evidenceReferences:
          type: array
          items:
            type: string

    RecordAUSTRACReferenceRequest:
      type: object
      required:
        - austracReferenceNumber
      properties:
        austracReferenceNumber:
          type: string
          minLength: 1
          maxLength: 50
          description: AUSTRAC filing reference number

    # --- EDD Schemas ---

    EDDChecklistResponse:
      type: object
      required:
        - id
        - caseId
        - sourceOfWealth
        - sourceOfFunds
        - relationshipPurpose
        - enhancedMonitoringFrequency
        - completedAt
        - completedBy
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        sourceOfWealth:
          type: string
        sourceOfFunds:
          type: string
        relationshipPurpose:
          type: string
        enhancedMonitoringFrequency:
          $ref: '#/components/schemas/EnhancedMonitoringFrequency'
        additionalNotes:
          type: string
        completedAt:
          type: string
          format: date-time
        completedBy:
          $ref: '#/components/schemas/UserSummary'

    SubmitEDDChecklistRequest:
      type: object
      required:
        - sourceOfWealth
        - sourceOfFunds
        - relationshipPurpose
        - enhancedMonitoringFrequency
      properties:
        sourceOfWealth:
          type: string
          minLength: 50
        sourceOfFunds:
          type: string
          minLength: 50
        relationshipPurpose:
          type: string
          minLength: 20
        enhancedMonitoringFrequency:
          $ref: '#/components/schemas/EnhancedMonitoringFrequency'
        additionalNotes:
          type: string

    # --- Onboarding Block Schemas ---

    OnboardingBlockResponse:
      type: object
      required:
        - id
        - caseId
        - customerId
        - blockType
        - syncStatus
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        blockType:
          $ref: '#/components/schemas/BlockType'
        blockReason:
          type: string
        syncStatus:
          $ref: '#/components/schemas/SyncStatus'
        lastSyncAttempt:
          type: string
          format: date-time
        syncAttemptCount:
          type: integer
        clearedAt:
          type: string
          format: date-time
        clearedBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time

    ClearOnboardingBlockRequest:
      type: object
      required:
        - clearanceReason
      properties:
        clearanceReason:
          type: string
          minLength: 20
          description: Reason for clearing the block

    AcceptL1ClosureRequest:
      type: object
      properties:
        reviewNotes:
          type: string
          description: Optional review notes

    # --- Dashboard Schemas ---

    DashboardCasesResponse:
      type: object
      required:
        - data
        - pagination
        - metrics
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummary'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        metrics:
          type: object
          properties:
            totalAssigned:
              type: integer
            atRisk:
              type: integer
            breached:
              type: integer

    DashboardMetricsResponse:
      type: object
      properties:
        myAssignedCount:
          type: integer
        myAtRiskCount:
          type: integer
        myBreachedCount:
          type: integer
        unassignedCount:
          type: integer
        pendingApprovalCount:
          type: integer
        l2ReviewQueueCount:
          type: integer

    QueueMetricsResponse:
      type: object
      properties:
        totalUnassigned:
          type: integer
        byTier:
          type: object
          properties:
            L1:
              type: integer
            L2:
              type: integer
        oldestUnassignedHours:
          type: number
        slaAtRiskCount:
          type: integer

    # --- Notification Schemas ---

    NotificationResponse:
      type: object
      required:
        - id
        - notificationType
        - title
        - body
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
        body:
          type: string
        caseId:
          type: string
          format: uuid
        caseReference:
          type: string
        readAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      required:
        - data
        - pagination
        - unreadCount
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        unreadCount:
          type: integer

    # --- Report Schemas ---

    CaseVolumeReportResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            totalCases:
              type: integer
            totalClosed:
              type: integer
            totalOpen:
              type: integer
        byPeriod:
          type: array
          items:
            type: object
            properties:
              period:
                type: string
              total:
                type: integer
              byCaseType:
                type: object
                additionalProperties:
                  type: integer
              byStatus:
                type: object
                additionalProperties:
                  type: integer

    SLAComplianceReportResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            totalCases:
              type: integer
            slaMetCount:
              type: integer
            slaBreachedCount:
              type: integer
            complianceRate:
              type: number
              format: float
        byCaseType:
          type: array
          items:
            type: object
            properties:
              caseType:
                $ref: '#/components/schemas/CaseType'
              totalCases:
                type: integer
              slaMet:
                type: integer
              slaBreached:
                type: integer
              avgResolutionDays:
                type: number

    SMRFilingReportResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            totalRecommended:
              type: integer
            totalApproved:
              type: integer
            totalRejected:
              type: integer
            totalFiled:
              type: integer
            pendingFiling:
              type: integer
        byMonth:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
              recommended:
                type: integer
              approved:
                type: integer
              filed:
                type: integer

    AgedCasesReportResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            totalAgedCases:
              type: integer
            oldestCaseDays:
              type: integer
        cases:
          type: array
          items:
            type: object
            properties:
              caseId:
                type: string
                format: uuid
              referenceCode:
                type: string
              caseType:
                $ref: '#/components/schemas/CaseType'
              status:
                $ref: '#/components/schemas/CaseStatus'
              ageDays:
                type: integer
              assignedUser:
                $ref: '#/components/schemas/UserSummary'

    ExportReportRequest:
      type: object
      required:
        - reportType
        - format
        - startDate
        - endDate
      properties:
        reportType:
          type: string
          enum: [case_volumes, sla_compliance, smr_filings, aged_cases]
        format:
          type: string
          enum: [csv, xlsx]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    # --- Timeline and Audit Schemas ---

    TimelineEntryResponse:
      type: object
      required:
        - id
        - entryType
        - action
        - summary
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        entryType:
          type: string
          enum: [ACTION, NOTE, SYSTEM_EVENT, COMMUNICATION, VIEW, CLOSURE, REOPEN, ESCALATION, SLA_WARNING, SLA_BREACH]
        action:
          type: string
        summary:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time

    TimelineListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntryResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    AuditLogEntryResponse:
      type: object
      required:
        - id
        - actionType
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        actionType:
          type: string
        actionDetail:
          type: object
          description: Structured action details (PII redacted)
        user:
          $ref: '#/components/schemas/UserSummary'
        ipAddress:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time

    AuditLogListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntryResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    # --- Document Schemas ---

    DocumentResponse:
      type: object
      required:
        - id
        - caseId
        - filename
        - contentType
        - sizeBytes
        - documentType
        - uploadedBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        filename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        documentType:
          $ref: '#/components/schemas/DocumentType'
        uploadedBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time

    DocumentListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DocumentResponse'

    # --- Configuration Schemas ---

    PEPThresholdResponse:
      type: object
      required:
        - thresholdValue
        - effectiveFrom
      properties:
        thresholdValue:
          type: number
          format: float
          example: 80.0
        effectiveFrom:
          type: string
          format: date-time
        changedBy:
          $ref: '#/components/schemas/UserSummary'

    UpdatePEPThresholdRequest:
      type: object
      required:
        - thresholdValue
      properties:
        thresholdValue:
          type: number
          format: float
          minimum: 0
          maximum: 100

    SLAWarningThresholdResponse:
      type: object
      description: |
        SLA warning threshold configuration. Warnings are triggered when this percentage
        of the SLA timeline has elapsed (FR-050).
      required:
        - thresholdPercentage
        - effectiveFrom
      properties:
        thresholdPercentage:
          type: number
          format: float
          description: Percentage of SLA elapsed to trigger warning (default 80)
          example: 80.0
        effectiveFrom:
          type: string
          format: date-time
          description: When this threshold became effective
        changedBy:
          $ref: '#/components/schemas/UserSummary'
          description: User who last changed the threshold

    UpdateSLAWarningThresholdRequest:
      type: object
      required:
        - thresholdPercentage
      properties:
        thresholdPercentage:
          type: number
          format: float
          minimum: 1
          maximum: 99
          description: Percentage of SLA elapsed to trigger warning (1-99)
          example: 80.0

    HolidayOverrideResponse:
      type: object
      required:
        - id
        - holidayDate
        - description
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        holidayDate:
          type: string
          format: date
        description:
          type: string
        region:
          type: string
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time

    HolidayOverrideListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HolidayOverrideResponse'

    AddHolidayOverrideRequest:
      type: object
      required:
        - holidayDate
        - description
      properties:
        holidayDate:
          type: string
          format: date
        description:
          type: string
          maxLength: 200
        region:
          type: string
          maxLength: 50

    # --- Pagination ---

    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8
        hasNext:
          type: boolean
        hasPrev:
          type: boolean

# ============================================================================
# DEFAULT SECURITY
# ============================================================================

security:
  - bearerAuth: []
